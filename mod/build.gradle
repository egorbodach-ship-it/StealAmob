plugins {
    id 'java'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = project.mod_version
group = project.mod_group

base {
    archivesName = project.mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = project.neoforge_version

    // Конфигурации запуска нужны только для локальной разработки в IDE.
    // В CI выполняется одна задача `build`, так что рантайм не скачивается.
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Подстановка версий в neoforge.mods.toml, чтобы номер держался в одном месте.
tasks.named('processResources', ProcessResources).configure {
    def replacements = [
            mod_id     : project.mod_id,
            mod_name   : project.mod_name,
            mod_version: project.mod_version,
            mod_license: project.mod_license,
            mod_authors: project.mod_authors,
            neoforge_version_range: "[${project.neoforge_version.tokenize('.').take(2).join('.')},)",
            minecraft_version_range: "[${project.minecraft_version},1.22)"
    ]
    inputs.properties replacements
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replacements
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : project.mod_name,
                'Specification-Version' : project.mod_version,
                'Implementation-Title'  : project.mod_name,
                'Implementation-Version': project.mod_version
        ])
    }
}
